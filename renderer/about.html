<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>关于“王钢蛋”</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #3a3330;
    user-select: none;
  }

  .card {
    height: 100%;
    padding: 24px 26px 20px;
    border-radius: 22px;
    background: linear-gradient(165deg, #fffdf8 0%, #faf3e8 100%);
    border: 1px solid rgba(120, 96, 70, 0.22);
    display: flex;
    flex-direction: column;
    -webkit-app-region: drag;
  }

  h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .version {
    margin-top: 6px;
    font-size: 11.5px;
    color: #a08b6c;
    letter-spacing: 0.6px;
  }

  .intro {
    margin: 14px 0 12px;
    font-size: 13px;
    color: #6b5c4b;
  }

  ul {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 13px;
    line-height: 1.95;
    color: #4a4038;
  }

  ul li::before {
    content: "·";
    margin-right: 7px;
    color: #c58a4a;
    font-weight: 700;
  }

  .meta {
    margin-top: auto;
    padding-top: 14px;
    font-size: 12.5px;
    line-height: 1.9;
    color: #6b5c4b;
  }

  .meta a {
    color: #b3543f;
    text-decoration: none;
    -webkit-app-region: no-drag;
    cursor: pointer;
  }

  .meta a:hover { text-decoration: underline; }

  .note {
    color: #a08b6c;
    font-size: 12px;
  }

  .close {
    margin-top: 14px;
    align-self: center;
    padding: 6px 34px;
    border: none;
    border-radius: 999px;
    background: #f0e3d0;
    color: #6b5540;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .close:hover { background: #ead8bf; }
  .close:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="card">
    <h1>关于“王钢蛋”</h1>
    <div class="version" id="version"></div>

    <p class="intro">只是一个桌面 todolist 小玩意儿。</p>

    <ul>
      <li>鼠标到处，打开卷轴，查看任务</li>
      <li>口语化输入可以识别任务时限</li>
      <li>状态栏图标右键有一些选项</li>
      <li>其他我也不知道还有啥</li>
    </ul>

    <div class="meta">
      作者：Shaw1988 &amp; TRAE<br />
      <a id="home" href="https://github.com/Shaw1988" target="_blank">https://github.com/Shaw1988</a><br />
      <span class="note">注：我 P 都不懂，都是 TRAE 做的~</span>
    </div>

    <button class="close" id="ok">好</button>
  </div>

  <script>
    const version = new URLSearchParams(location.search).get('v');
    if (version) document.getElementById('version').textContent = `v${version}`;
    document.getElementById('ok').addEventListener('click', () => window.close());
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') window.close();
    });
  </script>
</body>
</html>
